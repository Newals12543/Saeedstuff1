<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانک سوالات و درسنامه جامع قارچ‌شناسی پزشکی</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #15162c 50%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --card-bg: rgba(255, 255, 255, 0.04);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --wave-color-1: rgba(255, 75, 114, 0.8);
            --wave-color-2: rgba(255, 75, 114, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: background 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            transition: all 0.5s ease;
            position: relative;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeInScreen 0.3s ease forwards;
        }

        @keyframes fadeInScreen {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* هدر بالا (تاگل تم، مود و دکمه خروج/ریست) - بسیار فشرده */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
        }

        .top-left-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-toggle-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 2px;
        }

        .mode-option {
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            border: none;
            background: transparent;
        }

        .mode-option.active {
            background: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .icon-btn {
            padding: 0;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            cursor: pointer;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--glass-hover);
        }

        /* هیرو کارت کاملاً فشرده (بدون نیاز به اسکرول) */
        .hero-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .hero-info h2 {
            font-size: 1.1rem;
            color: var(--accent-primary);
            margin-bottom: 2px;
        }

        .hero-info p {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        /* ارلن تسلط مینیاتوری */
        .mastery-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mastery-container:hover {
            transform: scale(1.05);
        }

        .flask-wrapper {
            position: relative;
            width: 40px;
            height: 52px;
            margin-bottom: 4px;
        }

        .flask-shape {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.01);
            clip-path: polygon(32% 0%, 68% 0%, 68% 8%, 64% 8%, 64% 35%, 100% 90%, 100% 100%, 0% 100%, 0% 90%, 36% 35%, 36% 8%, 32% 8%);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.8s ease;
        }

        .wave {
            position: absolute;
            top: -10px;
            left: 50%;
            width: 100px;
            height: 100px;
            background: var(--wave-color-1);
            border-radius: 40%;
            transform: translateX(-50%);
            animation: rotateWave 3.5s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        .wave:nth-child(2) {
            top: -12px;
            background: var(--wave-color-2);
            border-radius: 38%;
            animation: rotateWave 5.5s linear infinite;
            z-index: 1;
        }

        .liquid.color-low { background: #be123c; }
        .liquid.color-mid { background: #d97706; }
        .liquid.color-high { background: #1d4ed8; }
        .liquid.color-max { background: #047857; }

        @keyframes rotateWave {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        .mastery-label {
            font-size: 0.7rem;
            color: var(--text-primary);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 6px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        /* بخش‌بندی محتوا در داشبورد فشرده */
        .section-title {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        @media (min-width: 540px) {
            .grid-menu {
                grid-template-columns: repeat(2, 1fr);
            }
            .full-width {
                grid-column: span 2;
            }
        }

        /* دکمه‌های بسیار فشرده برای جلوگیری از اسکرول */
        .btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: right;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .btn:hover {
            background: var(--glass-hover);
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .btn-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .btn-accent {
            background: var(--accent-primary);
            border: none;
            color: #ffffff;
        }

        .btn-accent:hover {
            background: var(--accent-hover);
        }

        .btn-nav {
            padding: 8px 14px;
            font-size: 0.8rem;
            justify-content: center;
            flex-direction: row;
        }

        .badge {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge-accent {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* درسنامه خلاصه */
        .summary-box {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            line-height: 1.8;
            font-size: 0.9rem;
            max-height: 60vh;
            overflow-y: auto;
            text-align: justify;
        }

        .summary-box h3 {
            color: var(--accent-primary);
            margin: 14px 0 6px 0;
            font-size: 1.05rem;
        }

        .summary-box ul {
            padding-right: 18px;
            margin-bottom: 10px;
        }

        .summary-box li {
            margin-bottom: 5px;
        }

        /* حفظ سوالات */
        .memorize-container {
            max-height: 65vh;
            overflow-y: auto;
            padding-left: 5px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .memo-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px;
        }

        .memo-q {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .memo-opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .memo-opt {
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            font-size: 0.85rem;
        }

        .memo-opt.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: #a7f3d0;
            font-weight: 600;
        }

        /* آزمون */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .quiz-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .question-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            font-weight: 500;
            white-space: pre-line;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .option-item:hover {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .option-item.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--success) !important;
            color: #a7f3d0;
        }

        .option-item.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error) !important;
            color: #fca5a5;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        /* مدال‌های سفارشی */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s forwards;
        }

        .custom-modal {
            background: #15162c;
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: scaleUp 0.2s forwards;
        }

        .custom-modal p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .custom-modal input {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.9); } to { transform: scale(1); } }

        /* لایت مود */
        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.98);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #4f46e5;
            --accent-hover: #4338ca;
        }

        body.light-mode .custom-modal {
            background: #ffffff;
            color: #0f172a;
        }

        body.light-mode .badge {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text-secondary);
        }

        body.light-mode .badge-accent {
            background: rgba(79, 70, 229, 0.15);
            color: var(--accent-primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر بالا شامل تاگل تم، مود و دکمه خروج -->
        <div class="top-controls">
            <div class="top-left-group">
                <button id="theme-toggle" class="icon-btn" title="تغییر تم">☀️</button>
                <button id="logout-btn" class="icon-btn" title="خروج و پاک کردن اطلاعات" onclick="logout()">🚪</button>
            </div>
            <div class="mode-toggle-switch">
                <button class="mode-option" id="mode-classic" onclick="setMode('classic')">کلاسیک</button>
                <button class="mode-option active" id="mode-modern" onclick="setMode('modern')">مدرن</button>
            </div>
        </div>

        <div id="modal-container"></div>

        <!-- داشبورد اصلی -->
        <div id="dashboard-screen" class="screen active">
            <!-- هیرو کارت: خوش‌آمدگویی و ارلن تسلط مینیاتوری -->
            <div class="hero-card">
                <div class="hero-info">
                    <h2 id="greeting">سلام!</h2>
                    <p id="dashboard-subtitle">سیستم هوشمند مرور و آزمون قارچ‌شناسی</p>
                </div>
                <div class="mastery-container" onclick="showMasteryDetails()" title="مشاهده درصد تسلط">
                    <div class="flask-wrapper">
                        <div class="flask-shape">
                            <div class="liquid" id="flask-liquid">
                                <div class="wave"></div>
                                <div class="wave"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mastery-label" id="mastery-percentage">0%</div>
                </div>
            </div>

            <!-- بخش محتوای اصلی بر اساس حالت -->
            <div id="main-content-area"></div>

            <!-- بخش ابزارهای مرور هوشمند (فشرده و بدون نیاز به اسکرول) -->
            <div class="section-title">مرور و آزمون هوشمند</div>
            <div class="grid-menu" style="grid-template-columns: repeat(3, 1fr) !important; gap: 6px; margin-bottom: 0;">
                <button class="btn" style="flex-direction: column; align-items: center; text-align: center; padding: 8px 6px; border-color: rgba(239, 68, 68, 0.3); color: #ef4444;" onclick="startChallengeQuiz()">
                    <span style="font-weight: 600; font-size: 0.78rem;">🎯 چالش</span>
                    <span class="badge" id="challenge-count" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; margin-top: 2px;">۰ سوال</span>
                </button>
                <button class="btn" style="flex-direction: column; align-items: center; text-align: center; padding: 8px 6px; border-color: rgba(234, 179, 8, 0.3); color: #f59e0b;" onclick="startBookmarkQuiz()">
                    <span style="font-weight: 600; font-size: 0.78rem;">⭐ نشان‌دار</span>
                    <span class="badge" id="bookmark-count" style="background: rgba(234, 179, 8, 0.1); color: #f59e0b; margin-top: 2px;">۰ سوال</span>
                </button>
                <button class="btn btn-accent" style="flex-direction: column; align-items: center; text-align: center; padding: 8px 6px;" onclick="startRandomComprehensiveQuiz()">
                    <span style="font-weight: 600; font-size: 0.78rem;">🎲 جامع رندوم</span>
                    <span class="badge badge-accent" style="margin-top: 2px;">۱۵۳ سوال</span>
                </button>
            </div>
        </div>

        <!-- صفحه زیرمبحث‌های جلسه (مدرن) -->
        <div id="subtopics-screen" class="screen">
            <div class="quiz-header">
                <span class="quiz-title" id="session-main-title">جلسه</span>
                <button class="btn btn-nav btn-accent" onclick="goHome()">بازگشت به خانه</button>
            </div>
            <div class="section-title">انتخاب زیرمبحث</div>
            <div class="grid-menu" id="subtopics-grid"></div>
        </div>

        <!-- صفحه درسنامه‌ها به تفکیک جلسه و زیرمبحث (کلاسیک) -->
        <div id="classic-notes-sessions-screen" class="screen">
            <div class="quiz-header">
                <span class="quiz-title">درسنامه‌ها به تفکیک جلسات</span>
                <button class="btn btn-nav btn-accent" onclick="goHome()">بازگشت به خانه</button>
            </div>
            <div class="grid-menu" id="classic-notes-sessions-grid"></div>
        </div>

        <div id="classic-notes-subtopics-screen" class="screen">
            <div class="quiz-header">
                <span class="quiz-title" id="classic-sess-title">جلسه</span>
                <button class="btn btn-nav btn-accent" onclick="openClassicNotesSessions()">بازگشت</button>
            </div>
            <div class="grid-menu" id="classic-notes-subtopics-grid"></div>
        </div>

        <!-- صفحه انتخاب گزینه (درسنامه یا سوالات) برای جلسات (مدرن) -->
        <div id="options-screen" class="screen">
            <div class="quiz-header">
                <span class="quiz-title" id="subtopic-header-title">زیرمبحث</span>
                <button class="btn btn-nav btn-accent" onclick="backToSubtopics()">بازگشت</button>
            </div>
            <div class="grid-menu">
                <button class="btn btn-accent" style="padding: 18px;" onclick="openSummary()">
                    <div class="btn-content">
                        <span style="font-size: 1rem; font-weight: bold;">📖 درسنامه خلاصه</span>
                        <span style="font-size: 0.78rem; opacity: 0.8;">مطالعه نکات کلیدی و مفهومی</span>
                    </div>
                </button>
                <button class="btn" style="padding: 18px;" id="btn-goto-questions" onclick="openQuestionsMenu()">
                    <div class="btn-content">
                        <span style="font-size: 1rem; font-weight: bold;">❓ بانک سوالات تستی</span>
                        <span style="font-size: 0.78rem; color: var(--text-secondary);" id="subtopic-q-count">سوالات تستی</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- صفحه انتخاب گزینه برای حالت ۵ بخشی (کلاسیک) -->
        <div id="section-options-screen" class="screen">
            <div class="quiz-header">
                <span class="quiz-title" id="section-option-title">بخش</span>
                <button class="btn btn-nav btn-accent" onclick="goHome()">بازگشت</button>
            </div>
            <div class="grid-menu">
                <button class="btn btn-accent" style="padding: 18px;" onclick="startSectionMemorize()">
                    <div class="btn-content">
                        <span style="font-size: 1rem; font-weight: bold;">🧠 حفظ سوالات</span>
                        <span style="font-size: 0.78rem; opacity: 0.8;">مشاهده تمام سوالات با پاسخ صحیح (اسکرول)</span>
                    </div>
                </button>
                <button class="btn" style="padding: 18px;" onclick="startSectionQuiz()">
                    <div class="btn-content">
                        <span style="font-size: 1rem; font-weight: bold;">⏱️ تمرین (رندوم سوال و گزینه)</span>
                        <span style="font-size: 0.78rem; color: var(--text-secondary);">آزمون و تمرین تعاملی</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- صفحه انتخاب حالت سوالات (حفظ یا تمرین) برای جلسات -->
        <div id="questions-mode-screen" class="screen">
            <div class="quiz-header">
                <span class="quiz-title" id="qmode-header-title">حالت سوالات</span>
                <button class="btn btn-nav btn-accent" onclick="backToOptions()">بازگشت</button>
            </div>
            <div class="grid-menu">
                <button class="btn btn-accent" style="padding: 18px;" onclick="startMemorizeMode()">
                    <div class="btn-content">
                        <span style="font-size: 1rem; font-weight: bold;">🧠 حفظ سوالات</span>
                        <span style="font-size: 0.78rem; opacity: 0.8;">مشاهده تمام سوالات با پاسخ صحیح (اسکرول)</span>
                    </div>
                </button>
                <button class="btn" style="padding: 18px;" onclick="startQuizMode()">

            { id: 153, q: "مکانیسم عمل ضد قارچی آزولها (فلوکونازول) شامل ......... است .", o: ["مهارتشکیل دوک تقسیم", "مهار سنتز گلوکان دیواره سلولی", "مهار سنتز DNA", "مهار سنتز ارگوسترول"], c: 3 }
        ];

        // --- متغیرهای حالت برنامه ---
        let viewMode = localStorage.getItem('mycology_view_mode') || 'modern'; // 'classic' or 'modern'
        let currentSession = null;
        let currentSubtopic = null;
        let currentSectionNum = null;
        let currentQuestionsList = [];
        let currentIndex = 0;
        let userAnswers = {};
        let isChallengeMode = false;
        let isBookmarkMode = false;

        let stats = JSON.parse(localStorage.getItem('mycology_stats')) || {};
        let bookmarks = JSON.parse(localStorage.getItem('mycology_bookmarks')) || {};

        // سیستم مدال سفارشی
        const CustomUI = {
            alert: function(text, callback) {
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="custom-modal-overlay">
                        <div class="custom-modal">
                            <p>${text}</p>
                            <div style="margin-top: 15px;">
                                <button class="btn btn-accent" id="modal-ok" style="width: 100%; justify-content: center;">تایید</button>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-ok').onclick = function() {
                    container.innerHTML = '';
                    if(callback) callback();
                };
            },
            confirm: function(text, onConfirm) {
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="custom-modal-overlay">
                        <div class="custom-modal">
                            <p>${text}</p>
                            <div style="display: flex; gap: 10px; margin-top: 15px;">
                                <button class="btn btn-accent" id="modal-yes" style="flex:1; justify-content: center;">بله</button>
                                <button class="btn" id="modal-no" style="flex:1; justify-content: center;">لغو</button>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-yes').onclick = function() {
                    container.innerHTML = '';
                    onConfirm();
                };
                document.getElementById('modal-no').onclick = function() {
                    container.innerHTML = '';
                };
            },
            prompt: function(text, onSubmit) {
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="custom-modal-overlay">
                        <div class="custom-modal">
                            <p>${text}</p>
                            <input type="text" id="modal-input" placeholder="نام شما..." autofocus />
                            <button class="btn btn-accent" id="modal-submit" style="width: 100%; justify-content: center;">ثبت نام</button>
                        </div>
                    </div>
                `;
                const submitAction = function() {
                    const val = document.getElementById('modal-input').value;
                    container.innerHTML = '';
                    onSubmit(val);
                };
                document.getElementById('modal-submit').onclick = submitAction;
                document.getElementById('modal-input').onkeydown = function(e) {
                    if (e.key === 'Enter') submitAction();
                };
            }
        };

        function logout() {
            CustomUI.confirm('آیا مطمئن هستید که می‌خواهید خارج شوید؟ تمام اطلاعات و آمارهای شما پاک خواهد شد.', function() {
                localStorage.clear();
                location.reload();
            });
        }

        function checkUser() {
            let username = localStorage.getItem('mycology_username');
            if (!username) {
                CustomUI.prompt('خوش آمدید! لطفا نام خود را وارد کنید:', function(inputName) {
                    username = (inputName && inputName.trim() !== "") ? inputName.trim() : 'دانشجوی پزشکی';
                    localStorage.setItem('mycology_username', username);
                    document.getElementById('greeting').innerText = `سلام ${username}!`;
                    initApp();
                });
            } else {
                document.getElementById('greeting').innerText = `سلام ${username}!`;
                initApp();
            }
        }

        function initApp() {
            updateToggleUI();
            renderDashboard();
        }

        function setMode(mode) {
            viewMode = mode;
            localStorage.setItem('mycology_view_mode', mode);
            updateToggleUI();
            renderDashboard();
        }

        function updateToggleUI() {
            document.getElementById('mode-classic').classList.toggle('active', viewMode === 'classic');
            document.getElementById('mode-modern').classList.toggle('active', viewMode === 'modern');
        }

        // رندر کردن داشبورد اصلی به صورت کاملاً فشرده (بدون نیاز به اسکرول)
        function renderDashboard() {
            const containerArea = document.getElementById('main-content-area');
            containerArea.innerHTML = '';
            const subtitleEl = document.getElementById('dashboard-subtitle');

            if (viewMode === 'modern') {
                subtitleEl.innerText = 'سیستم آموزشی مدرن (۷ جلسه و زیرمبحث‌ها)';
                
                const titleEl = document.createElement('div');

                titleEl.innerText = 'سرفصل جلسات آموزشی';
                containerArea.appendChild(titleEl);

                const grid = document.createElement('div');
                grid.className = 'grid-menu';
                grid.style.maxHeight = '240px';

                grid.style.paddingLeft = '4px';

                mycologyData.sessions.forEach(sess => {

                    btn.className = 'btn';
                    btn.style.padding = '8px 12px';

                        <div class="btn-content">

            } else {
                subtitleEl.innerText = 'بانک سوالات ۵ بخشی و درسنامه‌های جامع';

                const notesContainer = document.createElement('div');
                notesContainer.style.marginBottom = '8px';
                notesContainer.innerHTML = `
                    <button class="btn full-width btn-accent" style="padding: 10px 14px;" onclick="openClassicNotesSessions()">
                        <div class="btn-content">
                            <span style="font-size: 0.9rem; font-weight: bold;">📖 مطالعه درسنامه‌های جامع (تفکیک‌شده)</span>
                        </div>
                        <span class="badge badge-accent">جزوه</span>
                    </button>
                `;
                containerArea.appendChild(notesContainer);

                const titleEl = document.createElement('div');
                titleEl.className = 'section-title';
                titleEl.innerText = 'بخش‌های ۵ گانه بانک سوالات';
                containerArea.appendChild(titleEl);

                const grid = document.createElement('div');
                grid.className = 'grid-menu';

                for (let i = 1; i <= 5; i++) {
                    let qRange = i === 1 ? "سوالات ۱ تا ۳۰" : i === 2 ? "سوالات ۳۱ تا ۶۰" : i === 3 ? "سوالات ۶۱ تا ۹۰" : i === 4 ? "سوالات ۹۱ تا ۱۲۰" : "سوالات ۱۲۱ تا ۱۵۳";
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.style.padding = '8px 12px';
                    btn.innerHTML = `
                        <div class="btn-content">
                            <span style="font-weight: 600; font-size: 0.82rem;">بخش ${i} قارچ‌شناسی</span>
                            <span style="font-size: 0.72rem; color: var(--text-secondary);">${qRange}</span>
                        </div>
                        <span class="badge">بخش ${i}</span>
                    `;
                    btn.onclick = () => openSectionOptions(i);
                    grid.appendChild(btn);

                containerArea.appendChild(grid);
            }

            updateBadges();
            updateMasteryBar();

        // --- درسنامه‌های کلاسیک ---
        function openClassicNotesSessions() {
            const grid = document.getElementById('classic-notes-sessions-grid');
            grid.innerHTML = '';
            mycologyData.sessions.forEach(sess => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `
                    <div class="btn-content">
                        <span style="font-weight: 600;">${sess.title}</span>
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">مشاهده زیرمبحث‌ها و متن درسنامه</span>
                    </div>
                    <span class="badge">جزوه</span>
                `;
                btn.onclick = () => openClassicNotesSubtopics(sess.id);
                grid.appendChild(btn);
            });
            showScreen('classic-notes-sessions-screen');

        function openClassicNotesSubtopics(sessId) {
            currentSession = mycologyData.sessions.find(s => s.id === sessId);
            document.getElementById('classic-sess-title').innerText = currentSession.title;
            const grid = document.getElementById('classic-notes-subtopics-grid');
            grid.innerHTML = '';

            currentSession.subtopics.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `
                    <div class="btn-content">
                        <span style="font-weight: 600;">${sub.name}</span>
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">مطالعه نکات این زیرمبحث</span>
                    </div>
                    <span class="badge">مطالعه</span>
                `;
                btn.onclick = () => openClassicSummary(sub.name);
                grid.appendChild(btn);
            });
            showScreen('classic-notes-subtopics-screen');

        function openClassicSummary(subName) {
            document.getElementById('summary-header-title').innerText = `درسنامه: ${subName}`;
            document.getElementById('summary-content').innerHTML = currentSession.summary;
            showScreen('summary-screen');
        }

        function backFromSummary() {
            if (viewMode === 'modern') {
                showScreen('options-screen');
            } else {
                showScreen('classic-notes-subtopics-screen');
            }
        }

        // --- مدرن (جلسات و زیرمبحث‌ها) ---
        function openSession(sessionId) {
            currentSession = mycologyData.sessions.find(s => s.id === sessionId);
            document.getElementById('session-main-title').innerText = currentSession.title;
            
            const subGrid = document.getElementById('subtopics-grid');
            subGrid.innerHTML = '';

            currentSession.subtopics.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `
                    <div class="btn-content">
                        <span style="font-weight: 600;">${sub.name}</span>
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">${sub.hasQuestions ? 'دارای درسنامه و سوال تستی' : 'فقط درسنامه آموزشی'}</span>
                    </div>
                    <span class="badge">${sub.hasQuestions ? 'درسنامه و سوال' : 'فقط درسنامه'}</span>
                `;
                btn.onclick = () => selectSubtopic(sub);
                subGrid.appendChild(btn);
            });

            showScreen('subtopics-screen');
        }

        function selectSubtopic(sub) {
            currentSubtopic = sub;
            document.getElementById('subtopic-header-title').innerText = sub.name;
            
            const qBtn = document.getElementById('btn-goto-questions');
            if (!sub.hasQuestions) {
                qBtn.style.display = 'none';
            } else {
                qBtn.style.display = 'flex';
                document.getElementById('subtopic-q-count').innerText = `${sub.qIds.length} سوال تستی`;
            }

            showScreen('options-screen');
        }

        function openSummary() {
            document.getElementById('summary-header-title').innerText = `درسنامه: ${currentSubtopic.name}`;
            document.getElementById('summary-content').innerHTML = currentSession.summary;
            showScreen('summary-screen');
        }

        function openQuestionsMenu() {
            document.getElementById('qmode-header-title').innerText = `سوالات: ${currentSubtopic.name}`;
            showScreen('questions-mode-screen');
        }

        // --- حالت ۵ بخشی ---
        function openSectionOptions(sectionNum) {
            currentSectionNum = sectionNum;
            document.getElementById('section-option-title').innerText = `بخش ${sectionNum} قارچ‌شناسی`;
            showScreen('section-options-screen');
        }

        function startSectionMemorize() {
            document.getElementById('memo-header-title').innerText = `حفظ سوالات: بخش ${currentSectionNum}`;
            let startIdx = (currentSectionNum - 1) * 30;
            let endIdx = currentSectionNum === 5 ? allQuestions.length : startIdx + 30;
            let questions = allQuestions.slice(startIdx, endIdx);
            renderMemorizeCards(questions);
        }

        function startSectionQuiz() {
            userAnswers = {};
            document.getElementById('quiz-type-title').innerText = `تمرین بخش ${currentSectionNum}`;
            let startIdx = (currentSectionNum - 1) * 30;
            let endIdx = currentSectionNum === 5 ? allQuestions.length : startIdx + 30;
            let questions = allQuestions.slice(startIdx, endIdx);

            currentQuestionsList = prepareQuestions(questions);
            currentIndex = 0;
            showScreen('quiz-screen');
            renderQuestion();
        }

        function startMemorizeMode() {
            document.getElementById('memo-header-title').innerText = `حفظ سوالات: ${currentSubtopic.name}`;
            let questions = currentSubtopic.qIds.map(id => allQuestions.find(q => q.id === id)).filter(Boolean);
            renderMemorizeCards(questions);
        }

        function renderMemorizeCards(questions) {
            const container = document.getElementById('memorize-container');
            container.innerHTML = '';

            questions.forEach((qObj, idx) => {
                const card = document.createElement('div');
                card.className = 'memo-card';
                
                let optsHtml = '';
                qObj.o.forEach((optText, optIdx) => {
                    const isCorrect = (optIdx === qObj.c);
                    optsHtml += `<div class="memo-opt ${isCorrect ? 'correct-ans' : ''}">${optIdx + 1}) ${optText} ${isCorrect ? '✓ (پاسخ صحیح)' : ''}</div>`;
                });

                card.innerHTML = `<div class="memo-q">سؤال ${idx + 1}: ${qObj.q}</div><div class="memo-opts">${optsHtml}</div>`;
                container.appendChild(card);
            });

            showScreen('memorize-screen');
        }

        function startQuizMode() {
            userAnswers = {};
            document.getElementById('quiz-type-title').innerText = currentSubtopic.name;

            let questions = currentSubtopic.qIds.map(id => allQuestions.find(q => q.id === id)).filter(Boolean);
            currentQuestionsList = prepareQuestions(questions);
            currentIndex = 0;

            showScreen('quiz-screen');
            renderQuestion();
        }

        function startChallengeQuiz() {
            isChallengeMode = true;
            isBookmarkMode = false;
            userAnswers = {};
            document.getElementById('quiz-type-title').innerText = `🎯 ایستگاه چالش`;

            let filtered = allQuestions.filter(q => stats[q.id] && stats[q.id].wrongCount >= 2);
            if (filtered.length === 0) {
                CustomUI.alert('هنوز سوالی با تکرار اشتباه بالا ندارید. عالیه! 🥸');
                return;
            }

            currentQuestionsList = prepareQuestions(filtered);
            currentIndex = 0;
            showScreen('quiz-screen');
            renderQuestion();
        }

        function startBookmarkQuiz() {
            isChallengeMode = false;
            isBookmarkMode = true;
            userAnswers = {};
            document.getElementById('quiz-type-title').innerText = `⭐ سوالات نشان‌دار`;

            let filtered = allQuestions.filter(q => bookmarks[q.id]);
            if (filtered.length === 0) {
                CustomUI.alert('شما هنوز هیچ سوالی را نشان‌دار نکرده‌اید!');
                return;
            }

            currentQuestionsList = prepareQuestions(filtered);
            currentIndex = 0;
            showScreen('quiz-screen');
            renderQuestion();
        }

        function startRandomComprehensiveQuiz() {
            isChallengeMode = false;
            isBookmarkMode = false;
            userAnswers = {};
            document.getElementById('quiz-type-title').innerText = `🎲 آزمون جامع رندوم (کل سوالات)`;

            currentQuestionsList = prepareQuestions([...allQuestions]);
            currentIndex = 0;
            showScreen('quiz-screen');
            renderQuestion();
        }

        // تابع رندوم‌سازی سوالات و گزینه‌ها
        function prepareQuestions(questionsList) {
            let shuffledQuestions = shuffle(questionsList);
            return shuffledQuestions.map(item => {
                let mappedOptions = item.o.map((txt, index) => ({ text: txt, originalIndex: index }));
                return {
                    id: item.id,
                    q: item.q,
                    c: item.c,
                    shuffledOptions: shuffle(mappedOptions)
                };
            });
        }

        function renderQuestion() {
            if (currentQuestionsList.length === 0) return;

            const currentQ = currentQuestionsList[currentIndex];
            if (!stats[currentQ.id]) stats[currentQ.id] = { wrongCount: 0, consecutiveCorrect: 0 };

            document.getElementById('progress-text').innerText = `سوال ${currentIndex + 1} از ${currentQuestionsList.length}`;
            document.getElementById('question-text').innerText = currentQ.q;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            currentQ.shuffledOptions.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'option-item';
                div.innerText = opt.text;
                div.setAttribute('data-original-index', opt.originalIndex);
                div.onclick = () => selectOption(div, opt.originalIndex, currentQ.c, currentQ.id);

                if (userAnswers[currentQ.id] !== undefined) {
                    div.classList.add('disabled');
                    if (opt.originalIndex === currentQ.c) div.classList.add('correct');
                    if (opt.originalIndex === userAnswers[currentQ.id] && userAnswers[currentQ.id] !== currentQ.c) div.classList.add('wrong');
                }
                container.appendChild(div);
            });

            document.getElementById('btn-prev').style.visibility = (currentIndex === 0) ? 'hidden' : 'visible';
            document.getElementById('btn-next').innerText = (currentIndex === currentQuestionsList.length - 1) ? 'پایان' : 'سوال بعدی';
            updateBookmarkBtnUI();
        }

        function selectOption(element, selectedIdx, correctIdx, qId) {
            const items = document.querySelectorAll('.option-item');
            items.forEach(item => item.classList.add('disabled'));
            userAnswers[qId] = selectedIdx;

            if (selectedIdx === correctIdx) {
                element.classList.add('correct');
                stats[qId].consecutiveCorrect++;
                if (stats[qId].consecutiveCorrect >= 3) stats[qId].wrongCount = 0;
            } else {
                element.classList.add('wrong');
                stats[qId].wrongCount++;
                stats[qId].consecutiveCorrect = 0;
                items.forEach(item => {
                    if (parseInt(item.getAttribute('data-original-index')) === correctIdx) item.classList.add('correct');
                });
            }
            saveStats();
        }

        function navigateQuestion(step) {
            currentIndex += step;
            if (currentIndex >= currentQuestionsList.length) {
                CustomUI.alert('آزمون به پایان رسید. خسته نباشید!', () => goHome());
            } else if (currentIndex < 0) {
                currentIndex = 0;
            } else {
                renderQuestion();
            }
        }

        function toggleBookmark() {
            if (currentQuestionsList.length === 0) return;
            const qId = currentQuestionsList[currentIndex].id;
            bookmarks[qId] = !bookmarks[qId];
            saveBookmarks();
            updateBookmarkBtnUI();
        }

        function updateBookmarkBtnUI() {
            if (currentQuestionsList.length === 0) return;
            const qId = currentQuestionsList[currentIndex].id;
            const btn = document.getElementById('btn-bookmark');
            if (bookmarks[qId]) {
                btn.innerText = '⭐ نشان شده';
                btn.style.background = 'rgba(234, 179, 8, 0.2)';
            } else {
                btn.innerText = '☆ نشان';
                btn.style.background = '';
            }
        }

        function saveStats() {
            localStorage.setItem('mycology_stats', JSON.stringify(stats));
            updateBadges();
            updateMasteryBar();
        }

        function saveBookmarks() {
            localStorage.setItem('mycology_bookmarks', JSON.stringify(bookmarks));
            updateBadges();
        }

        function updateBadges() {
            let chCount = 0;
            for (let qId in stats) {
                if (stats[qId].wrongCount >= 2) chCount++;
            }
            const chEl = document.getElementById('challenge-count');
            if (chEl) chEl.innerText = `${chCount} سوال`;

            let bmCount = Object.keys(bookmarks).filter(k => bookmarks[k]).length;
            const bmEl = document.getElementById('bookmark-count');
            if (bmEl) bmEl.innerText = `${bmCount} سوال`;
        }

        function updateMasteryBar() {
            const total = allQuestions.length;
            let score = 0;
            for (let qId in stats) {
                const st = stats[qId];
                if (st.consecutiveCorrect >= 3) score += 1;
                else if (st.consecutiveCorrect === 2) score += 0.6;
                else if (st.consecutiveCorrect === 1 || st.wrongCount > 0) score += 0.25;
            }
            const pct = total > 0 ? Math.round((score / total) * 100) : 0;
            document.getElementById('mastery-percentage').innerText = `${pct}%`;

            const liquid = document.getElementById('flask-liquid');
            liquid.style.height = `${pct}%`;
            liquid.className = 'liquid';

            if (pct < 30) {
                liquid.classList.add('color-low');
                document.documentElement.style.setProperty('--wave-color-1', 'rgba(190, 18, 60, 0.8)');
                document.documentElement.style.setProperty('--wave-color-2', 'rgba(225, 29, 72, 0.5)');
            } else if (pct < 60) {
                liquid.classList.add('color-mid');
                document.documentElement.style.setProperty('--wave-color-1', 'rgba(217, 119, 6, 0.8)');
                document.documentElement.style.setProperty('--wave-color-2', 'rgba(245, 158, 11, 0.5)');
            } else if (pct < 85) {
                liquid.classList.add('color-high');
                document.documentElement.style.setProperty('--wave-color-1', 'rgba(29, 78, 216, 0.8)');
                document.documentElement.style.setProperty('--wave-color-2', 'rgba(59, 130, 246, 0.5)');
            } else {
                liquid.classList.add('color-max');
                document.documentElement.style.setProperty('--wave-color-1', 'rgba(4, 120, 87, 0.8)');
                document.documentElement.style.setProperty('--wave-color-2', 'rgba(16, 185, 129, 0.5)');
            }
        }

        function showMasteryDetails() {
            const pct = parseInt(document.getElementById('mastery-percentage').innerText);
            let msg = pct < 30 ? "ابتدای راه هستید، درسنامه‌ها را دقیق‌تر مطالعه کنید!" : pct < 70 ? "پیشرفت خوبی داشتید، به تمرین ادامه دهید." : "تسلط فوق‌العاده‌ای روی مباحث قارچ‌شناسی پیدا کرده‌اید! عالیه 🌸";
            CustomUI.alert(`درصد تسلط کل شما: ${pct}%<br><br>${msg}`);
        }

        function shuffle(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() {
            showScreen('dashboard-screen');
            renderDashboard();
        }

        function backToSubtopics() {
            showScreen('subtopics-screen');
        }

        function backToOptions() {
            showScreen('options-screen');
        }

        function backToPreviousFromMemorize() {
            if (viewMode === 'modern') {
                showScreen('questions-mode-screen');
            } else {
                showScreen('section-options-screen');
            }
        }

        // تم لایت/دارک
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('mycology_theme') === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.innerText = '🌙';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('mycology_theme', 'light');
                themeToggleBtn.innerText = '🌙';
            } else {
                localStorage.setItem('mycology_theme', 'dark');
                themeToggleBtn.innerText = '☀️';
            }
        });

        window.onload = () => {
            checkUser();
        };
    </script>
</body>
</html>
